name: CI

# Enterprise guardrail pipeline. Every module added to this repo must pass
# this pipeline before merge. This workflow is intentionally read-only /
# non-deploying — see cd.yml (added in a later DevOps module) for deployment.
#
# Docs: docs/devops/CI.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy values so build-time env validation passes in CI. Real secrets are
  # never required to lint/typecheck/test/build the client bundle — server
  # secrets are only read at runtime, not build time.
  VITE_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  VITE_SUPABASE_PROJECT_ID: "ci-placeholder"
  VITE_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-key"
  SUPABASE_URL: "https://ci-placeholder.supabase.co"
  SUPABASE_PROJECT_ID: "ci-placeholder"
  SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-key"

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit & Security Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      - name: Enforce minimum test count (anti-regression floor)
        run: |
          COUNT=$(find src -iname "*.test.*" | wc -l)
          echo "Found $COUNT test files"
          if [ "$COUNT" -lt 18 ]; then
            echo "::error::Test file count dropped below the enforced floor (6). Do not delete tests without replacing them."
            exit 1
          fi

  build:
    name: Build (Node/SSR target)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:node

  build-hostinger:
    name: Build (Hostinger static target)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:hostinger
